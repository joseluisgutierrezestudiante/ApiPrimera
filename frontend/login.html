<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | AutoPrime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,shopping_cart" />
  <link rel="stylesheet" href="./vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-autoprime navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="./index.html">AUTO<span class="text-danger">PRIME</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal" aria-label="Menú">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="collapse navbar-collapse" id="navPrincipal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="./index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#catalogo">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="./index.html#catalogo">Categorías</a></li>
        </ul>
        <div class="navbar-acciones d-flex align-items-center gap-2">
          <a class="nav-icono" href="./index.html#catalogo" aria-label="Buscar vehículos" title="Buscar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-4.3-4.3"></path>
            </svg>
          </a>
          <a class="nav-icono nav-icono--carrito" href="./carrito.html" aria-label="Carrito de compras" title="Carrito">
            <span class="material-symbols-outlined">shopping_cart</span>
            <span id="carrito-badge" class="nav-icono-badge d-none">0</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container d-flex justify-content-center py-5">
    <div class="card p-4 shadow-lg mx-auto" style="max-width: 400px; width: 100%;">
      <h2 class="text-center mb-4">Iniciar sesión</h2>
      <form id="form-login" novalidate>
        <div class="mb-3">
          <label for="login-email" class="form-label">Correo electrónico</label>
          <input type="email" id="login-email" name="email" class="form-control"
                 placeholder="tu@email.com" autocomplete="email" autofocus>
          <div class="invalid-feedback">El formato del correo no es válido.</div>
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" id="login-password" name="password" class="form-control"
                 placeholder="Ingresa tu contraseña" autocomplete="current-password">
          <div class="invalid-feedback">Ingresa tu contraseña.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        <p class="mt-3 text-center mb-0">
          ¿No tienes una cuenta? <a href="./registro.html" class="text-primary fw-bold">Regístrate</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="footer-autoprime">
    <div class="container">
      <div class="footer-base" style="margin-top: 0; border-top: 0;">
        <span>© 2026 AutoPrime. Concesionario multimarca.</span>
        <span>Bucaramanga · Envíos a nivel nacional</span>
      </div>
    </div>
  </footer>

  <script src="./vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/navbar.js"></script>
  <script src="./js/cart.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
